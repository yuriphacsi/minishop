name: MiniShop CI/CD
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-and-test:
    name: Build y pruebas
    runs-on: ubuntu-latest
    steps:
      - name: 1 - Descargar el código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # <-- CAMBIO 1: Historial completo para Sonar

      - name: 2 - Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 3 - Compilar
        run: mvn -B compile

      - name: 4 - Pruebas unitarias (Surefire)
        run: mvn -B test

      - name: 5 - Pruebas de integración, cobertura y empaquetado (Failsafe + JaCoCo)
        run: mvn -B verify -DskipUTs=true

      # <-- CAMBIO 2: Nuevo paso de Sonar
      - name: 6 - Análisis estático (SonarQube Cloud)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

      - name: 7 - Guardar reportes de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/  # <-- CAMBIO 3: Guardar reporte de JaCoCo

      - name: 8 - Guardar el .jar
        uses: actions/upload-artifact@v4
        with:
          name: minishop-jar
          path: target/*.jar
          if-no-files-found: error

  release:
    name: Publicar versión
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar el JAR validado
        uses: actions/download-artifact@v4
        with:
          name: minishop-jar
          path: dist
      - name: Crear la Release en GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*.jar
          --verify-tag --title "MiniShop $GITHUB_REF_NAME" --generate-notes